<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#7B6CF6">
  <title>OO的工作台</title>
  <style>
/* OO的工作台 — 全局样式 */
:root {
  --primary: #7B6CF6;
  --primary-light: #A99BFF;
  --primary-dark: #5B4FD6;
  --accent: #FF7BA9;
  --accent-light: #FFB3CD;
  --bg: #F7F7FB;
  --card-bg: #FFFFFF;
  --text-main: #1A1A2E;
  --text-sub: #6B6B80;
  --text-hint: #B0B0C0;
  --border: #ECECF5;
  --success: #34C759;
  --warning: #FF9F0A;
  --danger: #FF3B30;
  --income: #34C759;
  --expense: #FF3B30;
  --shadow: 0 4px 20px rgba(123,108,246,0.12);
  --shadow-lg: 0 8px 32px rgba(123,108,246,0.2);
  --radius: 12px;
  --radius-lg: 20px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text-main);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ===== 布局 ===== */
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; padding-bottom: 80px; }

.container { padding: 16px; }
.flex-row { display: flex; align-items: center; }
.flex-col { display: flex; flex-direction: column; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.flex-center { display: flex; justify-content: center; align-items: center; }
.flex-1 { flex:  1; }
.flex-wrap { flex-wrap: wrap; }
.hidden { display: none !important; }

/* ===== 卡片 ===== */
.card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }

/* ===== 按钮 ===== */
.btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 24px; font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; transition: all 0.2s; text-decoration: none; }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; }
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-secondary { background: var(--bg); color: var(--primary); border: 2px solid var(--primary); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-block { display: block; width: 100%; padding: 12px; }

/* ===== 标签 ===== */
.tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; margin: 2px 4px 2px 0; }
.tag-primary { background: rgba(123,108,246,0.1); color: var(--primary); }
.tag-accent { background: rgba(255,123,169,0.1); color: var(--accent); }
.tag-success { background: rgba(52,199,89,0.1); color: var(--success); }
.tag-warning { background: rgba(255,159,10,0.1); color: var(--warning); }
.tag-default { background: var(--bg); color: var(--text-sub); }

/* ===== 文本 ===== */
.text-main { color: var(--text-main); }
.text-sub { color: var(--text-sub); }
.text-hint { color: var(--text-hint); }
.text-primary { color: var(--primary); }
.text-accent { color: var(--accent); }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-income { color: var(--income); }
.text-expense { color: var(--expense); }
.font-sm { font-size: 12px; }
.font-md { font-size: 14px; }
.font-lg { font-size: 16px; }
.font-xl { font-size: 20px; }
.font-xxl { font-size: 28px; }
.font-bold { font-weight: 600; }
.text-center { text-align: center; }

/* ===== 输入 ===== */
.input, .textarea, select.input {
  background: var(--bg); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; width: 100%; border: 2px solid transparent; transition: border 0.2s; font-family: inherit;
}
.input:focus, .textarea:focus { border-color: var(--primary); outline: none; }
.textarea { min-height: 80px; resize: vertical; }
.label { font-size: 13px; color: var(--text-sub); margin-bottom: 4px; display: block; }
.field-group { margin-bottom: 12px; }

/* ===== 分隔线 ===== */
.divider { height: 1px; background: var(--border); margin: 12px 0; }

/* ===== 渐变头部 ===== */
.gradient-header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; padding: 20px 16px 32px; border-radius: 0 0 20px 20px; }

/* ===== 底部导航 ===== */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; display: flex; border-top: 1px solid var(--border); z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
.tabbar-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 0; cursor: pointer; transition: color 0.2s; color: var(--text-hint); }
.tabbar-item.active { color: var(--primary); }
.tabbar-icon { font-size: 20px; margin-bottom: 2px; }
.tabbar-label { font-size: 10px; }

/* ===== 浮动按钮 ===== */
.fab { position: fixed; right: 20px; bottom: 90px; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 12px rgba(123,108,246,0.4); z-index: 50; display: flex; align-items: center; justify-content: center; }

/* ===== 模态层 ===== */
.mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; padding: 20px 16px 32px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 18px; font-weight: 600; }
.modal-close { font-size: 24px; color: var(--text-hint); cursor: pointer; background: none; border: none; }

/* ===== 佣金高亮卡片 ===== */
.commission-card { background: linear-gradient(135deg, #FF7BA9, #FFB3CD); border-radius: var(--radius-lg); padding: 16px; color: #fff; text-align: center; margin: 10px 0; }
.commission-amount { font-size: 28px; font-weight: 700; margin: 6px 0; }

/* ===== 进度条 ===== */
.progress-bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); border-radius: 4px; transition: width 0.3s; }

/* ===== 空状态 ===== */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-hint); }
.empty-icon { font-size: 48px; margin-bottom: 8px; }
.empty-text { font-size: 14px; }

/* ===== 日历 ===== */
.calendar { width: 100%; }
.cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.cal-nav { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: none; background: var(--bg); border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--primary); }
.cal-title { font-size: 16px; font-weight: 600; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
.cal-weekday { text-align: center; font-size: 11px; color: var(--text-hint); padding: 4px 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; position: relative; font-size: 13px; }
.cal-cell:hover { background: var(--bg); }
.cal-cell.muted { color: var(--text-hint); }
.cal-cell.today { background: rgba(123,108,246,0.1); color: var(--primary); font-weight: 600; }
.cal-cell.selected { background: var(--primary); color: #fff; }
.cal-dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.cal-cell.selected .cal-dot { background: #fff; }

/* ===== 功能网格 ===== */
.func-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.func-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.func-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 4px; }
.func-text { font-size: 11px; color: var(--text-sub); }

/* ===== 列表项 ===== */
.list-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: none; }

/* ===== 待办 ===== */
.todo-item { display: flex; align-items: center; padding: 10px 0; }
.todo-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); margin-right: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; transition: all 0.2s; flex-shrink: 0; }
.todo-check.done { background: var(--success); border-color: var(--success); }
.todo-text { flex: 1; font-size: 14px; }
.todo-text.done { text-decoration: line-through; color: var(--text-hint); }
.todo-delete { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; padding: 4px 8px; }

/* ===== 服装网格 ===== */
.clothing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.clothing-card { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; }
.clothing-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--bg); }
.clothing-tags { padding: 8px; }

/* ===== 穿搭画板 ===== */
.outfit-canvas { position: relative; width: 100%; height: 400px; background: var(--bg); border-radius: var(--radius-lg); border: 2px dashed var(--border); overflow: hidden; }
.outfit-item { position: absolute; cursor: move; user-select: none; }
.outfit-item img { width: 100px; height: 100px; object-fit: contain; pointer-events: none; }
.outfit-item.selected { outline: 2px dashed var(--primary); outline-offset: 4px; }
.outfit-delete { position: absolute; top: -10px; right: -10px; width: 22px; height: 22px; background: var(--danger); color: #fff; border-radius: 50%; border: none; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.outfit-bar { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
.outfit-bar-item { width: 70px; height: 70px; border-radius: var(--radius); overflow: hidden; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; }
.outfit-bar-item img { width: 100%; height: 100%; object-fit: cover; }

/* ===== 筛选标签 ===== */
.filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
.filter-tag { padding: 4px 12px; border-radius: 16px; font-size: 12px; white-space: nowrap; cursor: pointer; border: 2px solid var(--border); color: var(--text-sub); flex-shrink: 0; }
.filter-tag.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ===== 角色切换 ===== */
.role-switch { display: flex; background: var(--bg); border-radius: 24px; padding: 3px; }
.role-btn { flex: 1; padding: 8px; border: none; background: none; border-radius: 20px; font-size: 13px; cursor: pointer; color: var(--text-sub); transition: all 0.2s; }
.role-btn.active { background: var(--primary); color: #fff; }

/* ===== 统计卡片 ===== */
.stats-row { display: flex; gap: 8px; }
.stats-item { flex: 1; text-align: center; }
.stats-num { font-size: 20px; font-weight: 700; }
.stats-label { font-size: 11px; color: var(--text-hint); margin-top: 2px; }

/* ===== Toast ===== */
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 300; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }

/* ===== 加载 ===== */
.loading { text-align: center; padding: 20px; color: var(--text-hint); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 上传区 ===== */
.upload-zone { border: 2px dashed var(--border); border-radius: var(--radius-lg); padding: 30px; text-align: center; cursor: pointer; }
.upload-zone:hover { border-color: var(--primary); }
.upload-preview { width: 100%; max-height: 300px; object-fit: contain; border-radius: var(--radius); margin-bottom: 12px; }

/* ===== 响应式 ===== */
@media (min-width: 481px) { #app { box-shadow: 0 0 40px rgba(0,0,0,0.05); min-height: 100vh; } }

</style>

<body>
  <div id="app">
    <div id="view"></div>
    <div class="tabbar" id="tabbar">
      <div class="tabbar-item active" data-route="workbench">
        <div class="tabbar-icon">🏠</div>
        <div class="tabbar-label">工作台</div>
      </div>
      <div class="tabbar-item" data-route="plan">
        <div class="tabbar-icon">📅</div>
        <div class="tabbar-label">计划</div>
      </div>
      <div class="tabbar-item" data-route="wardrobe">
        <div class="tabbar-icon">👗</div>
        <div class="tabbar-label">衣橱</div>
      </div>
      <div class="tabbar-item" data-route="media">
        <div class="tabbar-icon">📱</div>
        <div class="tabbar-label">自媒体</div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/page-workbench.js"></script>
  <script src="js/page-plan.js"></script>
  <script src="js/page-finance.js"></script>
  <script src="js/page-wardrobe.js"></script>
  <script src="js/page-media.js"></script>
  <script src="js/page-content.js"></script>
  <script src="js/page-settings.js"></script>

    document.addEventListener('DOMContentLoaded', () => {
      App.init();

  </script>
</body>
